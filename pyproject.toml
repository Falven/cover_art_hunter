############################################################
# Project metadata migrated from Poetry to PEP 621 for uv. #
############################################################

[project]
name = "cover-art-hunter"
version = "0.1.0"
description = "Fetch and optionally download highest-resolution cover art from MusicBrainz / Cover Art Archive."
readme = "README.md"
authors = [{ name = "Fran Aguilera", email = "falven2000@hotmail.com" }]
# Expanded to support Python 3.13 (remove upper bound later once validated for 3.14)
requires-python = ">=3.11,<3.14"
dependencies = [
    # Pillow 11.x adds Python 3.13 support.
    "pillow>=11.0.0,<12.0.0",
    "requests>=2.32.3,<3.0.0",
    # aiohttp 3.9.x supports Python 3.13; keep stable lower bound.
    "aiohttp>=3.9.5,<4.0.0",
    "tenacity>=8.4.2,<9.0.0",
    "prompt-toolkit>=3.0.47,<4.0.0",
    "tqdm>=4.66.4,<5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<9.0.0", "pytest-asyncio>=0.23.0,<0.24.0"]

[project.scripts]
cover-art-hunter = "cover_art_hunter.cover_art_hunter:cli"

[project.urls]
Homepage = "https://github.com/Falven/cover_art_hunter"
Repository = "https://github.com/Falven/cover_art_hunter"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

# Optional: uv-specific configuration (currently no special settings needed)
[tool.uv]
# (Removed deprecated/invalid generate-lockfile flag; uv creates uv.lock automatically.)

[tool.hatch.metadata]
allow-direct-references = true
